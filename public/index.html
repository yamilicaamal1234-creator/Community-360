<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community 360 — Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #07080A;
      background-image:
        radial-gradient(circle at 18% 22%, rgba(16, 185, 129, 0.14), transparent 38%),
        radial-gradient(circle at 82% 78%, rgba(6, 182, 212, 0.14), transparent 40%),
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass {
      background: rgba(18, 20, 26, 0.78);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
  </style>
</head>
<body class="min-h-screen text-zinc-100 flex items-center justify-center p-4">

  <div class="w-full max-w-md glass rounded-3xl p-8 md:p-10 shadow-[0_0_60px_-15px_rgba(16,185,129,0.28)] relative overflow-hidden">
    <!-- Línea superior luminosa -->
    <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-emerald-400 to-cyan-400"></div>

    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center text-zinc-950 font-extrabold text-sm shadow-lg shadow-emerald-500/20">
          C3
        </div>
        <div>
          <span class="font-bold text-lg tracking-tight text-white">Community<span class="text-emerald-400">360</span></span>
          <p class="mono text-[10px] text-zinc-400 uppercase tracking-widest">Hybrid Telemetry</p>
        </div>
      </div>
      <span class="mono text-[10px] px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-400/25 text-emerald-300">
        JWT • TLS
      </span>
    </div>

    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white tracking-tight">Bienvenido de vuelta</h1>
      <p class="text-xs text-zinc-400 mt-1">Autentícate contra TiDB Cloud para abrir el centro de observabilidad.</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-zinc-300 mb-1.5">Identificador de operador</label>
        <input type="text" id="username" required placeholder="admin"
          class="w-full px-4 py-3 bg-zinc-950/80 border border-zinc-800 rounded-xl text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400/50 transition">
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-300 mb-1.5">Clave de acceso</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-4 py-3 bg-zinc-950/80 border border-zinc-800 rounded-xl text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400/50 transition">
      </div>

      <p id="errorMsg" class="hidden text-xs text-rose-300 bg-rose-500/10 border border-rose-500/30 px-3.5 py-2.5 rounded-xl"></p>

      <button type="submit"
        class="w-full py-3.5 mt-2 bg-gradient-to-r from-emerald-400 to-cyan-400 hover:from-emerald-300 hover:to-cyan-300 text-zinc-950 font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition duration-200 cursor-pointer">
        Iniciar Sesión Segura
      </button>
    </form>

    <div class="mt-7 pt-5 border-t border-white/5 flex items-center justify-between mono text-[11px] text-zinc-500">
      <span>TiDB Serverless</span>
      <span>•</span>
      <span>Redis Cloud</span>
      <span>•</span>
      <span>Socket.IO</span>
    </div>
  </div>

  <script>
    if (localStorage.getItem('token_c360')) {
      window.location.href = '/dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Credenciales inválidas';
          errorMsg.classList.remove('hidden');
          return;
        }

        localStorage.setItem('token_c360', data.token);
        localStorage.setItem('user_c360', data.usuario.username);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorMsg.textContent = 'No se pudo conectar con el servidor';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
